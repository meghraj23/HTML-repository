<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Register form</title>
    <link rel="stylesheet" href="asscss.css">
</head>
<body>
    <h1>Student Register form</h1>
    <form action="">
    <label for="fanme">Full Name</label><br>
    <input type="text" name="" placeholder="Enter full name" id="fname"><br>
    <label for="mail">Email</label><br>
    <input type="email" name="" id="mail" placeholder="Enter your mail"><br>
    <label for="pass">Password</label><br>
    <input type="password" name="" id="pass" placeholder="Enter password"><br>
    <label for="phone">Phone Number</label><br>
    <input type="number" name="" id="phone" placeholder="Enter phone number"><br>
    <label for="date">Date of birth</label><br>
    <input type="date" name="" id="date"><br>
    <label for="">select course:</label><br>
<select name="course"><br>
    <option value="HTML">HTML</option>
    <option value="CSS">CSS</option>
    <option value="JAVA">JAVA</option><br>
</select><br>
    <label for="">Gender</label><br>
    <label for="m">male</label>
    <input type="radio" name="male" id="m" style="margin-left: 20px; width: 15px;">
    <label for="f">female</label>
    <input type="radio" name="female" id="f" style="margin-left: 20px; width: 15px;"><br>
    <label for="add">Address</label>
    <input type="textarea" name="" id="add" placeholder="Address" style="height: 50px;"><br>
    <input style="width: 200px; background-color: #1e3a5f; color: white; height: 40px;" type="button" value="Register">
</form>
<h1>Student Data Table</h1>
<table border="">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Course</th>
        <th>City</th>
    </tr>
    <tr>
        <td>1</td>

        <td>Mumbai</td>
    </tr>
        <tr>
        <td>2</td>
        <td>Sneha</td>

        <td>Pune</td>
    </tr>
        <tr>
        <td>3</td>
        <td>Amit</td>
        <td>JAVASCRIPT</td>
        <td>Nashik</td>
    </tr>
</table>
</body>
</html>
