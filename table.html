<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table and List</title>
</head>
<body>
    <h1><b>This is the unordered List</b></h1>
    <ul>
        <li>first item</li>
        <li>second item</li>
        <li>third item</li>
    </ul>
    <h1><b>this is the ordered list</b></h1>
    <ol type="1">
        <li>Ranks</li>
        <ol type="i">
            <li>first</li>
            <li>second</li>
        </ol>
        <li>numbers</li>
        <ol type="i">
            <li>one</li>
            <li>two</li>
        </ol>
    </ol> 
    <table border="dotted">
        <tr>
            <th>name</th>
            <th>roll no.</th>
        </tr>
        <tr>
            <td>meghraj</td>
            <td>12</td>
        </tr>
        <tr>
            <td>karan</td>
            <td>13</td>
        </tr>
        <tr>
            <td>shambhu</td>
            <td>14</td>
        </tr>
    </table>   
</body>
</html>
