<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <style>
        label{
            color: rgb(0, 0, 0);
            background-color: rgb(0, 89, 255);
            border-radius: 15%;
        }
        h1{
            color: cornflowerblue;
            margin-left: 30%;
        }
    </style>
</head>
<body>
    <h1>Studennt registered form</h1>
    <form style="margin-top: 30px; margin-left: 30%;">
   <label for="fname">First Name:</label><br> 
   <input type="text" name="" id="fname"><br>
   <label for="lname">Last Name:</label><br> 
   <input type="text" name="" id="lname"><br>
   <label for="pass">Password:</label><br> 
   <input type="password" name="" id="pass"><br>
   <label for="">Gender:</label><br>
   <label for="m">male</label>
   <label for="f">female</label>
   <input type="checkbox" name="" id="m">
   <input type="checkbox" name="" id="f"><br>
   <label for="">select course:</label><br>
   <select name="course"><br>
  <option value="computer">computer</option>
  <option value="electrical">eletrical</option>
</select>
</form>
</body>
</html>
